name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Publish @linkgrep/analytics's IIFE bundle to cdn.linkgrep.app whenever
      # the package is included in the release set. Fails LOUDLY if the upload
      # is not configured — silent skip is worse than a broken release because
      # browser users would silently get stale code.
      #
      # changesets/action exposes `publishedPackages` as a JSON array of
      # {name, version}; we gate on `@linkgrep/analytics` appearing in it.
      # Ref: https://github.com/changesets/action#outputs
      - name: Publish CDN artifact
        if: |
          steps.changesets.outputs.published == 'true' &&
          contains(fromJSON(steps.changesets.outputs.publishedPackages).*.name, '@linkgrep/analytics')
        run: |
          set -euo pipefail

          VERSION=$(jq -r '.[] | select(.name == "@linkgrep/analytics") | .version' \
            <<< '${{ steps.changesets.outputs.publishedPackages }}')
          MAJOR="${VERSION%%.*}"
          ARTIFACT="packages/analytics/dist/script.js"

          test -f "$ARTIFACT" || { echo "::error::Missing $ARTIFACT — build did not produce the CDN bundle."; exit 1; }

          if [ -z "${CDN_TOKEN:-}" ]; then
            echo "::error::@linkgrep/analytics ${VERSION} was published to npm but CDN_TOKEN is not configured."
            echo "::error::Wire the secret AND replace this step body with the real upload command before next release."
            exit 1
          fi

          # TODO(release): wire the real CDN upload. Examples:
          #   aws s3 cp "$ARTIFACT" "s3://cdn-linkgrep-app/analytics/v${MAJOR}/script.js" \
          #     --cache-control "public, max-age=300, s-maxage=300"
          #   aws s3 cp "$ARTIFACT" "s3://cdn-linkgrep-app/analytics/v${VERSION}/script.js" \
          #     --cache-control "public, max-age=31536000, immutable"
          # Or (Cloudflare R2): npx wrangler r2 object put cdn-linkgrep-app/analytics/v${MAJOR}/script.js --file "$ARTIFACT"
          echo "::error::CDN_TOKEN present but upload command not implemented (analytics ${VERSION}); refusing to ship a half-release."
          exit 1
        env:
          CDN_TOKEN: ${{ secrets.CDN_TOKEN }}
