name: Publish CDN

# Triggered by release.yml after a successful npm publish that included
# @linkgrep/analytics, OR manually for backfills. Decoupled from release.yml
# so a CDN-upload failure does not poison the npm-publish workflow status —
# npm and CDN are two writers to the same logical artifact and we don't want
# them coupled through one workflow's exit code.
#
# Uploads `packages/analytics/dist/script.js` (the 1.1 KB minified IIFE) to
# Cloudflare R2 under two paths per release:
#
#   script/v${MAJOR}/script.js        — major-pinned, short cache (5 min).
#                                       This is the URL the /lgr proxy
#                                       fetches; allows in-major hotfixes
#                                       without a customer-side URL change.
#                                       Stripe's js.stripe.com/v3/ pattern.
#
#   script/v${VERSION}/script.js      — exact-version, immutable cache
#                                       (1 year). Used by jsDelivr-style
#                                       version-pinned consumers and as
#                                       the audit trail for what shipped.
#
# Served via cdn.linkgrep.xyz (R2 custom domain — bucket binding configured
# in the Cloudflare dashboard; DNS CNAME from cdn.linkgrep.xyz to the
# bucket's public R2 endpoint).
#
# Uses the S3-compatible R2 API rather than `wrangler r2 object put`
# because Account API tokens (cfat_*) — which are the canonical R2 CI
# token type — use Signature V4 auth, not Bearer. wrangler attempts a
# `/memberships` preflight call that requires user-scope permissions
# the Account token does not have. aws-cli + the S3 endpoint is the
# Cloudflare-recommended CI path for R2 uploads.
#
# CORS policy is set ONCE at bucket creation time via the Cloudflare
# dashboard (R2 → bucket → Settings → CORS Policy) — not from this
# workflow, because object-write-scoped tokens cannot mutate bucket
# settings (correct least-privilege posture for CI). The policy that
# matches Stripe.js / Segment / Plausible / jsDelivr is captured in
# `.github/cdn-cors.json` for manual reference.
on:
  workflow_dispatch:
    inputs:
      version:
        description: '@linkgrep/analytics version to upload (e.g. 0.1.0)'
        required: true
        type: string

concurrency: cdn-publish-${{ inputs.version }}

env:
  R2_BUCKET: linkgrep-cdn

# Least-privilege scope for GITHUB_TOKEN. This workflow consumes
# R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY / R2_ENDPOINT via secrets, but
# does NOT write to the repo — no commits, no PR comments, no release
# creation. Per GitHub security hardening docs (verified verbatim via
# WebFetch 2026-05-23 against
# docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions):
#   "It's good security practice to set the default permission for the
#    GITHUB_TOKEN to read access only for repository contents. The
#    permissions can then be increased, as required, for individual
#    jobs within the workflow file."
#   "You should therefore make sure that the GITHUB_TOKEN is granted
#    the minimum required permissions."
# The repo-level default is already `read` (queried 2026-05-23 via
#   gh api repos/jacksnxly/linkgrep-sdk/actions/permissions/workflow
# → "default_workflow_permissions":"read") so this declaration is
# defense-in-depth — it survives a future repo-level default flip and
# makes the workflow's intent auditable inline.
# Validated by keryx 2026-05-23 issue validation, finding #3.
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned per docs.github.com/en/actions/security-for-github-actions —
      # this job consumes R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY and would
      # be the second-most-valuable target after release.yml. See release.yml
      # for the full rationale and CVE-2025-30066 precedent.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @linkgrep/analytics build

      # SECURITY: route `inputs.version` through an intermediate environment
      # variable so the runner shell — not the GitHub Actions templating
      # engine — dereferences it. Interpolating `${{ inputs.version }}`
      # directly into a `run:` script lets a malicious dispatcher break out
      # of the surrounding quotes BEFORE the regex gate on line 82 ever runs
      # (verified end-to-end via keryx 2026-05-23: payload
      # `0.0.0"; echo PWNED; exit 0; #` reached exit 0 with the regex
      # unreached). With `env:` indirection the value is just a bash
      # variable; double-quoting inside `[[ ... ]]` defangs metacharacters.
      # Per docs.github.com/en/actions/security-for-github-actions/security-guides/
      # security-hardening-for-github-actions#using-an-intermediate-environment-variable
      # ("the value of the expression is stored in memory and used as a
      # variable, and doesn't interact with the script generation process").
      - name: Validate inputs and artifact
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="$INPUT_VERSION"
          # Strict semver MAJOR.MINOR.PATCH (no pre-release / build suffix —
          # CDN serves stable only; pre-releases stay on npm + jsDelivr).
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version '$VERSION'. Expected strict semver MAJOR.MINOR.PATCH."
            exit 1
          fi
          ARTIFACT="packages/analytics/dist/script.js"
          test -f "$ARTIFACT" || {
            echo "::error::Missing $ARTIFACT — build did not produce the CDN bundle."
            exit 1
          }
          # Hard sanity check on artifact size: the IIFE is currently ~1 KB.
          # A 100 KB+ artifact would mean tsup config drifted (e.g. accidental
          # bundling of a dependency). Fail loudly before pushing junk to the CDN.
          SIZE=$(wc -c < "$ARTIFACT")
          if [ "$SIZE" -gt 102400 ]; then
            echo "::error::Artifact too large ($SIZE bytes > 100 KiB). Check tsup config; the script bundle should be < 5 KiB."
            exit 1
          fi
          echo "VERSION=$VERSION"      >> "$GITHUB_ENV"
          echo "MAJOR=${VERSION%%.*}"  >> "$GITHUB_ENV"
          echo "ARTIFACT=$ARTIFACT"    >> "$GITHUB_ENV"
          echo "Artifact size: $SIZE bytes"

      - name: Verify required secrets
        run: |
          set -euo pipefail
          missing=""
          [ -z "${R2_ACCESS_KEY_ID:-}" ]     && missing="$missing R2_ACCESS_KEY_ID"
          [ -z "${R2_SECRET_ACCESS_KEY:-}" ] && missing="$missing R2_SECRET_ACCESS_KEY"
          [ -z "${R2_ENDPOINT:-}" ]          && missing="$missing R2_ENDPOINT"
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing"
            echo "::error::Wire under repo Settings → Secrets → Actions. Get the values from"
            echo "::error::Cloudflare → R2 → Manage R2 API Tokens → object-scoped token for bucket '${R2_BUCKET}'."
            exit 1
          fi
        env:
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT:          ${{ secrets.R2_ENDPOINT }}

      # Exact-version upload — IMMUTABLE.
      # Pattern: max-age=31536000 + immutable tells the browser AND
      # Cloudflare's edge to cache forever; safe because the URL is pinned
      # to a unique version. Same Cache-Control Google / Stripe / npm use
      # for versioned static assets.
      - name: Upload exact-version artifact (immutable)
        run: |
          aws s3 cp "${ARTIFACT}" \
            "s3://${R2_BUCKET}/script/v${VERSION}/script.js" \
            --endpoint-url "${R2_ENDPOINT}" \
            --region auto \
            --content-type "application/javascript; charset=utf-8" \
            --cache-control "public, max-age=31536000, immutable"
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT:           ${{ secrets.R2_ENDPOINT }}

      # Major-pinned upload — MUTABLE.
      # Pattern: max-age=300 (5 min) lets the edge serve fast but recovers
      # within minutes if a hotfix bumps the major-pinned artifact. This
      # is the URL the example app's /lgr proxy fetches, so it MUST be
      # mutable to support in-major hotfixes without a customer redeploy.
      - name: Upload major-pinned artifact (mutable, short cache)
        run: |
          aws s3 cp "${ARTIFACT}" \
            "s3://${R2_BUCKET}/script/v${MAJOR}/script.js" \
            --endpoint-url "${R2_ENDPOINT}" \
            --region auto \
            --content-type "application/javascript; charset=utf-8" \
            --cache-control "public, max-age=300, s-maxage=300"
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT:           ${{ secrets.R2_ENDPOINT }}

      # Post-upload smoke test: fetch the just-uploaded URL via the public
      # CDN domain and verify (a) it returns 200, (b) the CORS header is
      # set (proves the one-time CORS policy is applied to the bucket),
      # (c) the artifact actually reached the edge.
      #
      # Missing CORS is a hard fail: the IIFE itself loads via <script src>
      # without CORS, but any cross-origin fetch() it issues (telemetry,
      # batched click submission) needs ACAO. Shipping the artifact with a
      # broken CORS policy would silently break every consumer integration
      # — exactly the regression this check exists to catch. Per
      # docs.github.com/en/actions/reference/workflow-commands-for-github-actions
      # ::error:: terminates the step.
      - name: Verify CDN serves the uploaded artifact
        run: |
          URL="https://cdn.linkgrep.xyz/script/v${VERSION}/script.js"
          # Allow up to 30 s for Cloudflare's edge to propagate.
          for i in 1 2 3 4 5 6; do
            if HDRS=$(curl -fsSI -A "publish-cdn-smoketest" "$URL" 2>&1); then
              echo "$HDRS"
              echo "$HDRS" | grep -i "^access-control-allow-origin: \*" >/dev/null || {
                echo "::error::CDN responded but CORS header missing on ${URL}."
                echo "::error::Apply policy from .github/cdn-cors.json via Cloudflare dashboard"
                echo "::error::(R2 → ${R2_BUCKET} → Settings → CORS Policy)."
                exit 1
              }
              echo "::notice::✓ ${URL} (HTTP 200, ${i} attempt$([ $i -eq 1 ] || echo s))"
              exit 0
            fi
            # Skip the trailing sleep on the last iteration — we're about
            # to bail anyway, no point burning 5 s on a guaranteed-failed run.
            [ "$i" -lt 6 ] && sleep 5
          done
          echo "::error::CDN did not serve ${URL} within 25 s. Check R2 bucket binding and cdn.linkgrep.xyz CNAME."
          exit 1

      - name: Report upload
        run: |
          echo "::notice::Uploaded @linkgrep/analytics ${VERSION} to:"
          echo "::notice::  https://cdn.linkgrep.xyz/script/v${VERSION}/script.js (immutable)"
          echo "::notice::  https://cdn.linkgrep.xyz/script/v${MAJOR}/script.js (mutable, 5 min cache)"
