name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege scope for GITHUB_TOKEN. This workflow installs deps
# and runs tests on `push` to main AND on `pull_request` from forks
# (which executes arbitrary contributor code from the PR head). Per
# GitHub security hardening docs (verified verbatim via WebFetch
# 2026-05-23 against
# docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions):
#   "It's good security practice to set the default permission for the
#    GITHUB_TOKEN to read access only for repository contents. The
#    permissions can then be increased, as required, for individual
#    jobs within the workflow file."
# Even though fork-PR tokens are automatically downgraded to read on
# `contents` by GitHub, declaring the scope explicitly makes the
# workflow's intent auditable and resilient to a future repo-level
# default-permissions flip. Repo default already `read` (queried via
# `gh api repos/.../actions/permissions/workflow` on 2026-05-23).
# Validated by keryx 2026-05-23 issue validation, finding #4.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from package.json `packageManager`. Specifying
      # `with: version:` here too triggers ERR_PNPM_BAD_PM_VERSION on v4.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Gate on type drift in tests too — vitest erases types at transpile
      # time and would have shipped LinkgrepErrorCode mismatches silently.
      # Per docs.npmjs.com/cli/v11 + vitest.dev/guide/cli.html (typecheck
      # default: false), tsc --noEmit is the canonical gate.
      - run: pnpm -r --filter "./packages/*" typecheck
      - run: pnpm test

  # Playwright e2e regression suite for the SvelteKit example app. Covers the
  # security regressions #C1 (SSRF path-boundary) and #I4 (unauthenticated
  # checkout) — the tests are useless if CI doesn't actually run them.
  # Workflow shape from https://playwright.dev/docs/ci-intro.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Playwright browsers
        run: pnpm --filter example-sveltekit-better-auth-stripe exec playwright install --with-deps chromium
      - name: Run Playwright tests
        run: pnpm --filter example-sveltekit-better-auth-stripe test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: examples/sveltekit-better-auth-stripe/playwright-report/
          retention-days: 30
